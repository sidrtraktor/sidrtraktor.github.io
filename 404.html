<script data-local-http-redirect>
  (function () {
    if (window.location.protocol !== "file:") return;
    var decodedPath = decodeURIComponent(window.location.pathname);
    var publicMarker = "/public/";
    var markerIndex = decodedPath.lastIndexOf(publicMarker);
    if (markerIndex < 0) return;
    var relativePath = decodedPath.slice(markerIndex + publicMarker.length);
    if (relativePath === "index.html") relativePath = "";
    else if (relativePath.endsWith("/index.html")) relativePath = relativePath.slice(0, -"index.html".length);
    window.location.replace("http://127.0.0.1:4173/" + relativePath + window.location.search + window.location.hash);
  }());
</script>
